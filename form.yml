---
form:
  - cluster
  - auto_modules_visit
  - auto_accounts
  - bc_num_hours
  - num_cores
  - bc_email_on_started
attributes:
  auto_modules_visit:
    default: false
    help: "This defines the version of VisIt you want to load."
    label: "VisIt version"
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
    help: |
      Number of CPU cores. (At least 4 GB of memory per core).
      Maximum values are 48, 96 and 120 cores for Pitzer, Cardinal,
      and Ascend respectively.
    min: 1
    max: 48
    step: 1
  cluster:
    widget: "select"
    options:
      - [
          "pitzer", "pitzer",
          data-max-cores: 48
        ]
      - [
          "cardinal", "cardinal",
          data-max-cores: 96
        ]
      - [
          "ascend", "ascend",
          data-max-cores: 120
        ]
